# Alembic(DB のマイグレーション)の設定。コマンドラインから `alembic ...` を打つとき用。
# DB の URL はここに書かない:migrations/env.py が app/config.py(環境変数 DATABASE_URL)から読む。
# 理由:URL に鍵が入ること、URL の中の % をこのファイル(configparser)が特別扱いして壊すこと。
[alembic]
script_location = %(here)s/migrations
# このフォルダを import の起点にする(migrations/env.py が app.models を読めるように)
prepend_sys_path = .
# 新しいファイル名の先頭に日付を付けて、並び順=作った順にする
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
